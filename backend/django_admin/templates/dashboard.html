<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pickle POS — Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
        h1 { margin-bottom: 0.25rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; background: #fafafa; }
        .card h3 { margin: 0 0 0.5rem; font-size: 0.875rem; color: #555; }
        .card p { margin: 0; font-size: 1.5rem; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Pickle POS</h1>
    <p class="subtitle">Welcome, {{ request.user.get_full_name|default:request.user.username }}</p>

    <div class="cards">
        <div class="card"><h3>Today's Sales</h3><p>—</p></div>
        <div class="card"><h3>Canteen Revenue</h3><p>—</p></div>
        <div class="card"><h3>Court Revenue</h3><p>—</p></div>
        <div class="card"><h3>Open Shifts</h3><p>—</p></div>
        <div class="card"><h3>Low Stock</h3><p>—</p></div>
        <div class="card"><h3>Bookings Today</h3><p>—</p></div>
    </div>

    <p style="margin-top: 2rem;"><a href="/admin/">Admin Panel</a></p>
</body>
</html>
